name: Test

on:
  push:
    branches:
      - test

jobs:
  touch_file:
    runs-on: ubuntu-latest
    steps:
      - name: Set up ssh key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVKEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.REMOTE_PORT }} ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts
      - name: Append a timestamp (epoch) to the testfile
        run: |
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.REMOTE_PORT }} ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} << ENDSSH
            echo $(date +%s) >> test.txt
          ENDSSH
