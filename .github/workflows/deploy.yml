name: Build & restart server

on:
  push:
    branches:
      - trunk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up ssh key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVKEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.REMOTE_PORT }} ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts
      - name: Update and rebuild the server
        run: |
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.REMOTE_PORT }} ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} << ENDSSH
            cd backend
            git pull origin trunk
            go build backend
          ENDSSH
  deploy:
    name: Restart the server
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Set up ssh key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ssh_privkey }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.remote_port }} ${{ secrets.remote_host }} >> ~/.ssh/known_hosts
      - name: Restart the server
        run: |
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.REMOTE_PORT }} ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} << ENDSSH
            systemctl --user restart backend.service
          ENDSSH
